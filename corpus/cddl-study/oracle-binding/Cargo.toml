[package]
name = "bindle-cddl-study"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
cddl = { path = "../cddl-0.10.7", default-features = false, features = ["std", "ast-span", "cbor", "json", "additional-controls"] }
wasm-bindgen = "0.2"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = false
