[package]
name = "snug_wasm"
# A version site (version.edn, D343): the placeholder; `bb stamp` writes the release version.
version = "0.0.0-unreleased"
license = "MIT"
repository = "https://github.com/3sln/snug"
edition = "2021"
publish = false

# The P1.4 wasm build: the same generated modules as host/rust, plus
# host/wasm/src/lib.rs (a plain integer ABI, no wasm-bindgen, no imports),
# assembled by kin/scripts/wasm-build into .cache/snug-wasm/.

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

# P7.9: `sdk` builds the SDK runtime exports (src/sdk.rs) instead of the
# P1.4/P3.4 ones; `compiler` builds the compiler module (src/cc.rs).
[features]
sdk = []
compiler = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The size-optimised build P1.4 also reports (the strongest wasm on size).
[profile.size]
inherits = "release"
opt-level = "z"

# P7.9 also reports opt-level "s".
[profile.size-s]
inherits = "release"
opt-level = "s"
