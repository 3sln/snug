# snug's hosted CI (P9.20, D356; one job per kind, D368): the gate sets of
# ci/gate-map.edn, run with `bb gates`, so every gate runs under the
# kin/scripts/watchdog.mjs caps and a NOT RUN line fails the job (release-policy
# §2, §4). Read-only: no secrets, no publish, deploy, tag or upload step, and no
# pull_request_target. .github/workflows/release.yml calls it (workflow_call, mode
# 'release') to test a release commit before it is tagged and published.
#
#   pull requests, pushes to main   land     `bb gates land`, plus compat and linux
#   tags v* and src/v*, manual run, release  the five shards of :partitions :release,
#   release.yml's call (mode release)        one after another in ONE job, plus
#                                            compat and linux
#
# Jobs (D368). The free plan runs at most 5 macOS jobs at once, and a tag run with
# a job per shard and per cell lost cells as "not acquired". Each kind is one job,
# so a run needs at most 2 macOS jobs at once (land or release, and compat):
#   land     macOS   `bb gates land`
#   release  macOS   a step per shard, in :partitions order; every step runs and
#                    reports even when an earlier one failed (if: success() ||
#                    failure()), and the job fails at the end if any did
#   compat   macOS   npm-test on Node 20, 22 and 24 (setup-node per version), and
#                    rust-api-test under `rustup run` on rust-version and stable
#   linux    Ubuntu  the same five cells through ci/run-gate.sh
# `bb gates --check` parses this file: the release steps are exactly the shards,
# the compat and linux cells are ci/gate-map.edn's :ci-compat, and the timeouts
# below clear the caps (kin/scripts/gates, ci-matrix-problems).
#
# Matrix choice. The primary toolchain is macOS arm64, Node 24.6.0 (the exact
# Node that tools/unicode/gen-tables.mjs pins, which unicode-test's --check
# needs) and Rust 1.92.0 (pinned in .github/actions/setup: the toolchain
# release-policy §2 records every Rust gate on, so a new Rust release cannot
# turn a land run red by itself): every gate of both sets runs on it, once, including
# the heavy identity, fuzz and proptest gates, whose subject is JS == Rust on
# one machine, not a toolchain. The `compat` matrix adds only the cells a
# toolchain can change: npm-test (host/js) on the latest Node 20, 22 and 24 (20
# is engines.node's floor, with SNUG_NODE_OLDEST=1 as node-oldest runs it), and
# rust-api-test on Rust 1.87 (rust-version) and on the latest stable, where a
# new Rust release shows up first. The release set holds node-oldest
# and msrv too, which test the floors on the primary job's runner.
#
# proptest (release-long) runs on the primary Node 24 by design: its failing
# slow-compile / slow-validate checks read the worker thread's CPU clock,
# process.threadCpuUsage(), which needs Node >= 23.9; on Node 20 they can only
# warn. No job here runs proptest on Node 20 (one that did would be
# warning-only for slow-compile/slow-validate and must say so).
#
# Why macOS arm64: the gates were written and recorded there (tools/runtime/run.mjs
# reads sysctl and sw_vers, the Chrome default path is macOS's, wasm-build wraps
# rust-lld with DYLD_LIBRARY_PATH).
#
# Linux. The `linux` job (ubuntu-24.04, x86_64) runs the two gates whose
# commands are portable, on every run: npm-test on Node 20, 22 and 24, and
# rust-api-test (kin/scripts/rust-crate's assembled crate: cargo test, doctests,
# rustdoc, and Clippy where the toolchain has it) on Rust 1.87 and stable. Both
# are POSIX sh and Node, with no kin checkout and no Babashka, so each cell runs
# its gate the way `bb gates` does, with ci/run-gate.sh: under
# kin/scripts/watchdog.mjs with the gate map's caps, failing on a non-zero exit
# or on a NOT RUN line. The macOS gate sets stay the only full runs.
#
# timeout-minutes. land, compat and linux: above the sum of their gates' wall
# caps and at most GitHub's 360 (land 298 min of caps; compat and linux 130).
# release: the five shards' caps sum to about 23 hours, more than one job may
# run, so each shard STEP's timeout clears that shard's largest gate cap (a stuck
# gate is stopped and named by its watchdog, not by GitHub) and the job has
# GitHub's 360. Measured on hosted macos-15 (D368): vm about 26 min, the others
# 3-9 min each, the whole job about an hour with setup.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    # release-policy §4 / §9: src/vX.Y.Z tags the release commit; vX.Y.Z tags the generated
    # dist commit, which has no workflow, so it starts no run of its own. Tags pushed by
    # release.yml with GITHUB_TOKEN start no run either (GitHub's rule); release.yml calls
    # this workflow itself before it tags.
    tags: ['v*', 'src/v*']
  workflow_dispatch:
  workflow_call:
    inputs:
      mode:
        description: "'land' or 'release': which gate set (release.yml passes 'release')"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.mode || 'event' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # kin, which bb.edn reads as ../kin/src: the commit snug's gates last passed against.
  # Move it deliberately, with a land run.
  KIN_REF: 21e8ab9c3d14d438c31916a7e052cf5929b75ca3
  npm_config_update_notifier: 'false'

defaults:
  run:
    working-directory: snug

jobs:
  land:
    name: land (bb gates land)
    if: inputs.mode == 'land' || (!inputs.mode && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')))
    runs-on: macos-15
    timeout-minutes: 305
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: snug
          persist-credentials: false
      - uses: ./snug/.github/actions/setup
        with:
          wasm: 'true'      # wasm-sdk-test, vm-test's wasm arm
          compare: 'true'   # size, wasm-opt, types-test's TypeScript
      - run: bb gates land

  # the release set: one job, a step per :partitions :release shard in order (D368)
  release:
    name: release (bb gates release-*, in sequence)
    if: inputs.mode == 'release' || (!inputs.mode && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')))
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: snug
          persist-credentials: false
      # every shard's tools: the wasm nightly (scan-test, vm-test, the wasm shard), bench/compare
      # (cbor2, esbuild, wasm-opt, TypeScript), rust-version (msrv), Node 20 (node-oldest),
      # workerd and Chrome (runtime, wasm-package-test)
      - uses: ./snug/.github/actions/setup
        with:
          node-oldest: 'true'
          msrv: 'true'
          wasm: 'true'
          compare: 'true'
          browsers: 'true'
      - name: release-core
        if: success() || failure()
        timeout-minutes: 60
        run: bb gates release-core
      - name: release-vm
        if: success() || failure()
        timeout-minutes: 150
        run: bb gates release-vm
      - name: release-rust
        if: success() || failure()
        timeout-minutes: 90
        run: bb gates release-rust
      - name: release-wasm
        if: success() || failure()
        timeout-minutes: 120
        run: bb gates release-wasm
      - name: release-long
        if: success() || failure()
        timeout-minutes: 200
        run: bb gates release-long

  # npm-test on Node 20, 22, 24 and rust-api-test on rust-version and stable, one macOS job
  compat:
    name: compat (Node 20/22/24, Rust rust-version/stable)
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: snug
          persist-credentials: false
      # Rust: stable as the default (with clippy) and rust-version beside it; Node is set per cell below
      - uses: ./snug/.github/actions/setup
        with:
          rust: stable
          msrv: 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: success() || failure()
        with:
          node-version: '20'
      - name: npm-test, Node 20
        if: success() || failure()
        run: bb gates npm-test
        env:
          # Node 20 lacks a test-only oracle (node-oldest runs npm test the same way)
          SNUG_NODE_OLDEST: '1'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: success() || failure()
        with:
          node-version: '22'
      - name: npm-test, Node 22
        if: success() || failure()
        run: bb gates npm-test
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: success() || failure()
        with:
          node-version: '24'
      - name: npm-test, Node 24
        if: success() || failure()
        run: bb gates npm-test
      - name: rust-api-test, rust-version
        if: success() || failure()
        run: rustup run "$SNUG_RUST_VERSION" bb gates rust-api-test
        env:
          # the rust-version toolchain has no clippy (D344); anywhere else a missing clippy is a SKIP
          SNUG_CLIPPY_OPTIONAL: '1'
      - name: rust-api-test, stable
        if: success() || failure()
        run: rustup run stable bb gates rust-api-test

  # npm-test and rust-api-test on Linux (see the header), one Ubuntu job, through ci/run-gate.sh
  linux:
    name: linux (Node 20/22/24, Rust rust-version/stable)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: snug
          persist-credentials: false
      - name: Rust (rust-version and stable)
        run: |
          set -euo pipefail
          command -v rustup >/dev/null || { echo "::error::rustup is not on the runner"; exit 1; }
          v=$(sed -n 's/^rust-version *= *"\([0-9.]*\)".*/\1/p' host/rust/Cargo.toml | head -1)
          [[ "$v" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::could not read one rust-version (got '$v')"; exit 1; }
          # rust-version without Clippy (D344), stable with it
          rustup toolchain install "$v" --profile minimal --no-self-update
          rustup toolchain install stable --profile minimal --component clippy --no-self-update
          echo "SNUG_RUST_VERSION=$v" >> "$GITHUB_ENV"
          rustup run "$v" rustc --version; rustup run stable rustc --version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: success() || failure()
        with:
          node-version: '20'
      - name: npm-test, Node 20
        if: success() || failure()
        run: bash ci/run-gate.sh npm-test host/js npm test --gate-wall=1800 --gate-cpu=3600
        env:
          SNUG_NODE_OLDEST: '1'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: success() || failure()
        with:
          node-version: '22'
      - name: npm-test, Node 22
        if: success() || failure()
        run: bash ci/run-gate.sh npm-test host/js npm test --gate-wall=1800 --gate-cpu=3600
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: success() || failure()
        with:
          node-version: '24'
      - name: npm-test, Node 24
        if: success() || failure()
        run: bash ci/run-gate.sh npm-test host/js npm test --gate-wall=1800 --gate-cpu=3600
      - name: rust-api-test, rust-version
        if: success() || failure()
        run: rustup run "$SNUG_RUST_VERSION" bash ci/run-gate.sh rust-api-test . sh host/rust/tests/run
        env:
          SNUG_CLIPPY_OPTIONAL: '1'
      - name: rust-api-test, stable
        if: success() || failure()
        run: rustup run stable bash ci/run-gate.sh rust-api-test . sh host/rust/tests/run

  # one status to require: every job that ran passed, and on a release run the release job ran
  ci:
    name: ci
    if: always()
    needs: [land, release, compat, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - env:
          LAND: ${{ needs.land.result }}
          RELEASE: ${{ needs.release.result }}
          COMPAT: ${{ needs.compat.result }}
          LINUX: ${{ needs.linux.result }}
          IS_RELEASE: ${{ inputs.mode == 'release' || (!inputs.mode && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))) }}
        run: |
          echo "land: $LAND  release: $RELEASE  compat: $COMPAT  linux: $LINUX  (release run: $IS_RELEASE)"
          [ "$COMPAT" = success ] && [ "$LINUX" = success ] || exit 1
          if [ "$IS_RELEASE" = true ]; then [ "$RELEASE" = success ]; else [ "$LAND" = success ]; fi
